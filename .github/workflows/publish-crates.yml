# Publishes slap to crates.io. The release workflow runs it once the release is built, as the
# `./publish-crates` entry of `publish-jobs` in dist-workspace.toml.
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    name: Publish to crates.io
    # `cargo publish` builds the crate before uploading it, and slap is built for macOS.
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
